name: Build and Release from GitGud

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 0. 一开始就 checkout 自己的仓库，让当前目录是 git 仓库
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream
        id: clone
        shell: pwsh
        run: |
          git clone --depth 1 https://gitgud.io/fuckworld/115.git upstream
          $sha = git -C upstream rev-parse HEAD
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Cloned upstream at $sha"

      - name: Check if already released
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = "${{ steps.clone.outputs.sha }}"
          if (-not $sha) {
            Write-Host "No sha found, will build."
            "skip=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $short = $sha.Substring(0,7)
          Write-Host "Upstream short sha: $short"

          $tags = gh release list --limit 100 --json tagName --jq '.[].tagName'
          Write-Host "Existing release tags:"
          $tags | ForEach-Object { Write-Host "  $_" }

          $hit = $false
          if ($tags) {
            foreach ($t in $tags) {
              if ($t -like "*$short*") { $hit = $true; break }
            }
          }

          if ($hit) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "Already released $short, skipping."
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
            Write-Host "New commit $short, will build."
          }

      - name: Setup Go
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build server
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        working-directory: upstream
        run: |
          ./server/Build-Server.ps1 -Go "go"

      - name: Collect artifacts
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item upstream/server/work/dfo-lan/bin/wireprobe-handoff-source.exe dist/ -ErrorAction SilentlyContinue
          Copy-Item upstream/server/work/dfo-lan/bin/wireprobe-pvf.exe dist/ -ErrorAction SilentlyContinue
          Get-ChildItem dist

      - name: Prepare release metadata
        if: steps.check.outputs.skip == 'false'
        id: meta
        shell: pwsh
        run: |
          $sha = "${{ steps.clone.outputs.sha }}".Substring(0,7)
          $ts = (Get-Date -AsUTC -Format "yyyyMMdd-HHmm")
          "ts=$ts" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "tag=build-$ts-$sha" >> $env:GITHUB_OUTPUT

      - name: Package
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/*.exe -DestinationPath "wireprobe-${{ steps.meta.outputs.ts }}.zip" -Force

      - name: Create Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Build ${{ steps.meta.outputs.ts }} (upstream ${{ steps.meta.outputs.sha }})"
          files: |
            dist/*.exe
            wireprobe-*.zip

      - name: Cleanup old releases
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $cutoff = (Get-Date).ToUniversalTime().AddDays(-3)
          Write-Host "Removing releases older than $cutoff"
          $list = gh release list --limit 200 --json tagName,createdAt --jq '.[] | "\(.tagName) \(.createdAt)"'
          foreach ($line in $list) {
            $parts = $line -split ' '
            $tag = $parts[0]
            $created = [datetime]::Parse($parts[1]).ToUniversalTime()
            if ($created -lt $cutoff) {
              Write-Host "Deleting release $tag (created $created)"
              gh release delete $tag --yes --cleanup-tag
            }
          }
